<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tez Kargo — Личный кабинет</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.header{
    background:#e60012;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:10px;
    font-size:16px;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    background:#e60012;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#c90010;
}

.result{
    margin-top:15px;
}

.parcel{
    border:1px solid #eee;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
}

.parcel b{
    color:#e60012;
}

.status{
    display:inline-block;
    margin-top:8px;
    padding:6px 10px;
    background:#eee;
    border-radius:20px;
    font-size:13px;
}

.warehouse{
    background:#fff5f5;
    border:1px solid #ffd5d5;
    padding:15px;
    border-radius:12px;
    line-height:1.6;
    white-space:pre-line;
    margin-bottom:10px;
}

.success{
    color:green;
    margin-top:10px;
}

.error{
    color:red;
    margin-top:10px;
}

.loading{
    text-align:center;
    padding:15px;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="header">
    🚚 TEZ KARGO
</div>

<div class="container">

    <!-- КЛИЕНТ -->

    <div class="card">

        <div class="title">
            👤 Личный кабинет
        </div>

        <input
            type="text"
            id="clientCode"
            placeholder="Введите код клиента"
        >

        <button onclick="loadClient()">
            🔍 Найти мои посылки
        </button>

        <div id="clientResult"></div>

    </div>


    <!-- АДРЕС СКЛАДА -->

    <div class="card">

        <div class="title">
            📦 Адрес склада в Китае
        </div>

        <div
            class="warehouse"
            id="warehouseText"
        >龙眼
18922256904
广州市白云区石门街道石沙路820号C6-108仓龙眼</div>

        <button onclick="copyAddress()">
            📋 Скопировать адрес
        </button>

        <div
            id="copyMessage"
            class="success"
        ></div>

    </div>


    <!-- ПОИСК TRACK -->

    <div class="card">

        <div class="title">
            🔎 Поиск посылки
        </div>

        <input
            type="text"
            id="trackCode"
            placeholder="Введите трек-код"
        >

        <button onclick="searchTrack()">
            Найти посылку
        </button>

        <div id="trackResult"></div>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
===================================================== */

const API_URL = "https://script.google.com/macros/s/AKfycbwVgYyCu8YuPxqhdkOra1F0FfSENe44ys-Ad_wRdQp3CfuR2ISzlWZ4Irt7_IFz3a_2/exec";


/* =====================================================
   АДРЕС СКЛАДА
===================================================== */

const WAREHOUSE_ADDRESS =
`龙眼
18922256904
广州市白云区石门街道石沙路820号C6-108仓龙眼`;


/* =====================================================
   COPY ADDRESS
===================================================== */

function copyAddress(){

    navigator.clipboard
        .writeText(WAREHOUSE_ADDRESS)

        .then(function(){

            document.getElementById("copyMessage")
                .innerText =
                "✅ Адрес склада скопирован";

        })

        .catch(function(){

            const textArea =
                document.createElement("textarea");

            textArea.value =
                WAREHOUSE_ADDRESS;

            document.body.appendChild(textArea);

            textArea.select();

            document.execCommand("copy");

            document.body.removeChild(textArea);

            document.getElementById("copyMessage")
                .innerText =
                "✅ Адрес склада скопирован";

        });

}


/* =====================================================
   LOAD CLIENT
===================================================== */

function loadClient(){

    const clientCode =
        document
        .getElementById("clientCode")
        .value
        .trim();

    const result =
        document
        .getElementById("clientResult");


    if(!clientCode){

        result.innerHTML =
            '<div class="error">Введите код клиента</div>';

        return;

    }


    result.innerHTML =
        '<div class="loading">⏳ Загрузка...</div>';


    fetch(API_URL, {

        method:"POST",

        headers:{
            "Content-Type":"text/plain;charset=utf-8"
        },

        body:JSON.stringify({

            action:"getClient",

            client_code:clientCode

        })

    })

    .then(response => response.json())

    .then(data => {

        if(data.success === false){

            result.innerHTML =
                `<div class="error">
                    ❌ ${data.message || "Клиент не найден"}
                </div>`;

            return;

        }


        let html = "";


        if(data.name){

            html += `
                <div class="parcel">
                    <b>👤 Имя:</b>
                    ${data.name}
                </div>
            `;

        }


        if(data.phone){

            html += `
                <div class="parcel">
                    <b>📱 Телефон:</b>
                    ${data.phone}
                </div>
            `;

        }


        if(data.client_code){

            html += `
                <div class="parcel">
                    <b>🆔 Код клиента:</b>
                    ${data.client_code}
                </div>
            `;

        }


        if(data.parcels){

            html += `
                <div class="title">
                    📦 Мои посылки
                </div>
            `;


            data.parcels.forEach(parcel => {

                html += `

                    <div class="parcel">

                        <b>Трек-код:</b>
                        ${parcel.track_code || "-"}

                        <br><br>

                        <b>Вес / цена:</b>
                        ${parcel.price || "-"}

                        <br><br>

                        <b>Статус:</b>

                        <span class="status">
                            ${parcel.status || "Не указан"}
                        </span>

                    </div>

                `;

            });

        }


        if(!html){

            html =
                '<div class="error">Информация не найдена</div>';

        }


        result.innerHTML = html;

    })

    .catch(error => {

        console.error(error);

        result.innerHTML = `

            <div class="error">

                ❌ Ошибка соединения с сервером.

                <br><br>

                Проверьте API_URL в HTML.

            </div>

        `;

    });

}


/* =====================================================
   SEARCH TRACK
===================================================== */

function searchTrack(){

    const track =
        document
        .getElementById("trackCode")
        .value
        .trim();

    const result =
        document
        .getElementById("trackResult");


    if(!track){

        result.innerHTML =
            '<div class="error">Введите трек-код</div>';

        return;

    }


    result.innerHTML =
        '<div class="loading">⏳ Поиск...</div>';


    fetch(API_URL, {

        method:"POST",

        headers:{
            "Content-Type":"text/plain;charset=utf-8"
        },

        body:JSON.stringify({

            action:"searchTrack",

            track_code:track

        })

    })

    .then(response => response.json())

    .then(data => {

        if(data.success === false){

            result.innerHTML = `

                <div class="error">

                    ❌ ${data.message || "Посылка не найдена"}

                </div>

            `;

            return;

        }


        result.innerHTML = `

            <div class="parcel">

                <b>📦 Трек-код:</b>

                ${data.track_code || track}

                <br><br>

                <b>👤 Клиент:</b>

                ${data.client_code || "-"}

                <br><br>

                <b>💰 Стоимость:</b>

                ${data.price || "-"}

                <br><br>

                <b>📍 Статус:</b>

                <span class="status">

                    ${data.status || "Не указан"}

                </span>

            </div>

        `;

    })

    .catch(error => {

        console.error(error);

        result.innerHTML = `

            <div class="error">

                ❌ Ошибка соединения с сервером.

            </div>

        `;

    });

}

</script>

</body>
</html>
